<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري المصادقة...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="msg">جاري مصادقة الحساب...</h2>
        <p>يتم الآن إرسال بيانات الدخول إلى تطبيق Grido Studio.</p>
    </div>

    <script>
        // التقاط الـ Token من الرابط (URL Fragment) وإرساله إلى التطبيق المحلي (Wails)
        const hash = window.location.hash;
        if (hash) {
            // توجيه المتصفح إلى السيرفر المحلي المؤقت المفتوح بواسطة تطبيق Go
            window.location.href = 'http://localhost:34567/callback' + hash;
        } else {
            document.getElementById('msg').innerText = 'خطأ في المصادقة!';
            document.querySelector('p').innerText = 'لم يتم العثور على رمز الوصول في الرابط.';
        }
    </script>
</body>
</html>
