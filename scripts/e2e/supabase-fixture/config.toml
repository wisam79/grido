# Disposable fixture only, pinned to Supabase CLI 2.81.3's config template.
# Never copied over the production scaffold; substituted under RUNNER_TEMP.
project_id = "@@PROJECT_ID@@"

[api]
enabled = true
port = @@API_PORT@@
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = @@DB_PORT@@
shadow_port = @@SHADOW_PORT@@
health_timeout = "3m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Repository seed.sql is absent. Fixture initialization is explicit, not a
# fabricated production seed or a rewritten migration history.
[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = false
port = @@STUDIO_PORT@@

# CLI 2.81.3 calls the local Mailpit service `inbucket`, not `local_smtp`.
[inbucket]
enabled = true
port = @@MAIL_PORT@@
smtp_port = @@SMTP_PORT@@

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:9347"
additional_redirect_urls = ["http://127.0.0.1:9347/admin", "http://127.0.0.1:9347/cam", "http://127.0.0.1:34115", "http://127.0.0.1:34115/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 100
token_refresh = 150
token_verifications = 30

[auth.external.google]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
