version: '3'

dotenv: ['.env']

vars:
  APP_NAME: "GridoStudio"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # ios and android are omitted for desktop platforms to prevent unix tool errors on Windows
  # ios: ./build/ios/Taskfile.yml
  # android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  test:backend:
    summary: Runs all Go backend unit and integration tests
    cmds:
      - go test -v ./internal/...

  test:backend:cover:
    summary: Runs Go tests with coverage report
    cmds:
      - go test -v -coverprofile=coverage.out ./internal/...

  test:backend:race:
    summary: Runs Go tests with race condition detector
    cmds:
      - go test -race ./internal/...

  test:frontend:
    summary: Runs frontend unit and component tests via Vitest
    dir: frontend
    cmds:
      - npm run test

  test:frontend:quick:
    summary: Runs quick frontend unit tests without coverage
    dir: frontend
    cmds:
      - npm run test:unit

  test:print:
    summary: Runs unified print engine tests across backend and frontend
    cmds:
      - go test -v ./internal/service -run "TestPrint.*"
      - npm --prefix frontend run test:print

  test:e2e:
    summary: Runs frontend end-to-end tests via Playwright (Chromium)
    dir: frontend
    cmds:
      - npm run test:e2e:fast

  test:all:
    summary: Runs complete testing suite across backend and frontend
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:e2e

  docs:check:
    summary: Runs the mandatory documentation sync gate (metrics, inventory, doc coverage)
    desc: |
      بوابة التوثيق الإلزامية — تفشل عند انحراف الأرقام المرجعية أو وجود مستند
      غير مُسجَّل في الجرد أو تغيير كود بلا توثيق مرافق.
      المرجع: docs/DOCUMENTATION_MAP.md · المهارة: .agents/skills/grido-docs-sync-guard/SKILL.md
    cmds:
      - node scripts/docs-gate.mjs --strict-refs

