<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grido Studio</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grido Cam">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090b10">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --panel: #11141b;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --text: #f1f5f9;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Cairo', -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 20px calc(env(safe-area-inset-bottom, 16px) + 12px);
      user-select: none;
    }

    /* Minimalist Header */
    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn.active {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Main Deck */
    main {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: auto 0;
    }

    .capture-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Minimalist Shutter Button with Clickable Affordance */
    .shutter-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .shutter-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid var(--border);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
    }

    .shutter-ring:hover {
      border-color: rgba(37, 99, 235, 0.4);
    }

    .shutter-button {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, background 0.15s;
    }

    .shutter-button:active {
      transform: scale(0.94);
      background: var(--primary-hover);
    }

    .shutter-icons {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-camera {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    /* Clean + badge */
    .plus-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 24px;
      height: 24px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .plus-badge svg {
      width: 16px;
      height: 16px;
      fill: var(--primary);
    }

    .shutter-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.08);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    /* Simple Progress State */
    .progress-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 0;
    }

    .progress-ring-simple {
      width: 54px;
      height: 54px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Simple Success State */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
    }

    .success-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon-box svg {
      width: 28px;
      height: 28px;
      fill: var(--success);
    }

    .success-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--success);
    }

    /* Minimal Session Reel */
    .reel-panel {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
    }

    .reel-panel::-webkit-scrollbar {
      display: none;
    }

    .thumb {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Minimalist Footer */
    footer {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .latency-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">G</div>
      <span class="brand-title">Grido Studio</span>
    </div>

    <div class="header-right">
      <button id="fs-btn" class="icon-btn" title="ملء الشاشة">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

      <button id="sound-btn" class="icon-btn active" title="الصوت">
        <svg id="sound-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02M3 9v6h4l5 5V4L7 9H3Z"/>
        </svg>
      </button>

      <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="conn-text">متصل</span>
      </div>
    </div>
  </header>

  <!-- Main Action Deck -->
  <main>
    <div class="capture-panel">
      
      <!-- Idle State -->
      <div id="state-idle">
        <div class="shutter-wrapper">
          <div class="shutter-ring">
            <label for="camera-in" class="shutter-button">
              <div class="shutter-icons">
                <svg class="shutter-camera" viewBox="0 0 24 24">
                  <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
                </svg>
                <div class="plus-badge">
                  <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
              </div>
            </label>
          </div>
        </div>

        <div class="shutter-label">التقاط للكانفاس</div>

        <div class="actions-row">
          <label for="gallery-in" class="action-btn">
            <svg viewBox="0 0 24 24">
              <path d="M19 19H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-7 8l-3.5 4.5H18L13.5 10l-2.5 3Z"/>
            </svg>
            <span>المعرض</span>
          </label>
        </div>
      </div>

      <!-- Uploading State -->
      <div id="state-uploading" class="progress-state">
        <div class="progress-ring-simple"></div>
        <div class="progress-text" id="pct-text">جاري الرفع ...</div>
      </div>

      <!-- Success State -->
      <div id="state-success" class="success-state">
        <div class="success-icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        </div>
        <div class="success-text">تمت الإضافة للكانفاس ✓</div>
      </div>

      <!-- Hidden Native File Inputs -->
      <input type="file" id="camera-in" accept="image/*" capture="environment" style="display: none;">
      <input type="file" id="gallery-in" accept="image/*" style="display: none;">
    </div>

    <!-- Recent Session Reel (Icon-Driven) -->
    <div class="reel-panel" id="reel"></div>
  </main>

  <!-- Minimal Footer -->
  <footer>
    <span>اتصال محلي آمن</span>
    <span class="latency-val" id="ping">-- ms</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    // Audio / Haptics
    let sound = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function getAudio() {
      if (!actx && AudioCtx) actx = new AudioCtx();
      if (actx && actx.state === 'suspended') actx.resume();
      return actx;
    }

    function playShutter() {
      if (!sound) return;
      try {
        const c = getAudio();
        if (!c) return;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(320, c.currentTime);
        o.frequency.exponentialRampToValueAtTime(80, c.currentTime + 0.06);
        g.gain.setValueAtTime(0.5, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.07);
        o.connect(g);
        g.connect(c.destination);
        o.start();
        o.stop(c.currentTime + 0.08);
      } catch(e) {}
    }

    function playSuccess() {
      if (!sound) return;
      try {
        const c = getAudio();
        if (!c) return;
        const now = c.currentTime;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(587.33, now); // D5
        o.frequency.setValueAtTime(880.00, now + 0.08); // A5
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        o.connect(g);
        g.connect(c.destination);
        o.start(now);
        o.stop(now + 0.3);
      } catch(e) {}
    }

    function haptic() {
      if (sound && navigator.vibrate) navigator.vibrate(60);
    }

    document.getElementById('sound-btn').addEventListener('click', function() {
      sound = !sound;
      this.classList.toggle('active', sound);
    });

    // States
    const idleView = document.getElementById('state-idle');
    const uploadView = document.getElementById('state-uploading');
    const successView = document.getElementById('state-success');
    const pctText = document.getElementById('pct-text');
    const reel = document.getElementById('reel');

    function setView(v) {
      idleView.style.display = v === 'idle' ? 'block' : 'none';
      uploadView.style.display = v === 'upload' ? 'flex' : 'none';
      successView.style.display = v === 'success' ? 'flex' : 'none';
    }

    // Ping
    async function checkPing() {
      const t0 = performance.now();
      try {
        const res = await fetch('/ping');
        if (res.ok) {
          document.getElementById('ping').textContent = Math.round(performance.now() - t0) + ' ms';
          document.getElementById('conn-text').textContent = 'متصل';
        }
      } catch {
        document.getElementById('ping').textContent = '--';
        document.getElementById('conn-text').textContent = 'منقطع';
      }
    }
    checkPing();
    setInterval(checkPing, 5000);

    // Upload
    async function sendFile(file) {
      if (!file || !file.type.startsWith('image/')) return;

      playShutter();
      haptic();
      setView('upload');
      pctText.textContent = 'جاري الرفع ...';

      // Thumbnail
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = e.target.result;
        reel.prepend(img);
      };
      reader.readAsDataURL(file);

      const form = new FormData();
      form.append('photo', file, file.name || 'shot.jpg');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload?token=' + encodeURIComponent(token));

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round((e.loaded / e.total) * 100);
          pctText.textContent = p + '%';
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          setView('success');
          playSuccess();
          haptic();
          setTimeout(() => {
            setView('idle');
            document.getElementById('camera-in').value = '';
            document.getElementById('gallery-in').value = '';
          }, 1800);
        } else {
          alert('فشل الإرسال: ' + xhr.responseText);
          setView('idle');
        }
      };

      xhr.onerror = () => {
        alert('فشل الاتصال بالشبكة المحلية');
        setView('idle');
      };

      xhr.send(form);
    }

    document.getElementById('camera-in').addEventListener('change', function() {
      if (this.files && this.files[0]) sendFile(this.files[0]);
    });

    document.getElementById('gallery-in').addEventListener('change', function() {
      if (this.files && this.files[0]) sendFile(this.files[0]);
    });

    // Fullscreen / App Mode Toggle
    const fsBtn = document.getElementById('fs-btn');
    if (fsBtn) {
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        }
      });
    }

    // Detect Standalone PWA Mode
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone) {
      const conn = document.getElementById('conn-text');
      if (conn) conn.textContent = 'تطبيق متصل';
      if (fsBtn) fsBtn.style.display = 'none';
    }
  </script>
</body>
</html>
