[build]
  base = "admin-web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GIT_SUBMODULES = "false"

[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

[[redirects]]
  from = "/api/version"
  to = "/.netlify/functions/version"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
