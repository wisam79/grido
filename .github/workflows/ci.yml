name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Runs in parallel with Backend & E2E from minute 0
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails3 CLI
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          fi

      - name: Generate Wails v3 Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit Tests & Coverage
        working-directory: ./frontend
        run: npm run test:coverage

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  #   → Runs in parallel from minute 0
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Prepare placeholder frontend dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html

      - name: Go Vet
        run: go vet ./internal/...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./internal/... ./...

      - name: Run Go Tests
        run: go test -v ./internal/...

  # ───────────────────────────────────────────────
  # Job 3: Playwright E2E Tests (Linux - Super Fast)
  #   → Runs headless browser tests in parallel on Ubuntu
  # ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests (Linux)
    runs-on: ubuntu-latest
    # ️ غير حاجب مؤقتاً (مقصود وموثَّق): حزمة E2E لم تكن قابلة للتشغيل إطلاقاً قبل إصلاح
    # تعارض منفذ Vite (9245) في playwright.config.ts، ومحاكي Wails فيها لا يزال بنمط v2
    # (window.go / window.runtime) بينما ربطات v3 تستدعي $Call.ByID من @wailsio/runtime
    # ⇒ التطبيق يعرض شاشة قفل الترخيص وتفشل التوكيدات.
    # الإصلاح المتتبع: Q-02 في docs/development-plan/TASKS.md.
    # 👉 بعد إصلاح المحاكي: احذف السطر التالي ليصبح الحاجب فعّالاً.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails3 CLI
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          fi

      - name: Generate Wails v3 Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium)
        working-directory: ./frontend
        run: npx playwright test --project=chromium

  # ───────────────────────────────────────────────
  # Job 4: Windows Build Verification (Windows)
  #   → Fast compilation smoke test without node/playwright overhead
  # ───────────────────────────────────────────────
  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-v2

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails3 CLI
        shell: powershell
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          }

      - name: Build Wails v3 App Binary (Smoke Test)
        shell: powershell
        env:
          CGO_ENABLED: '1'
          APP_VERSION: 'v0.0.0-ci'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: wails3 task build
