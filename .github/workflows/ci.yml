name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Runs in parallel with Backend & E2E from minute 0
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails generate module

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit Tests & Coverage
        working-directory: ./frontend
        run: npm run test:coverage

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  #   → Runs in parallel from minute 0
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run Go Tests
        run: go test -v ./internal/...

  # ───────────────────────────────────────────────
  # Job 3: Playwright E2E Tests (Linux - Super Fast)
  #   → Runs headless browser tests in parallel on Ubuntu
  # ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails generate module

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium)
        working-directory: ./frontend
        run: npx playwright test --project=chromium

  # ───────────────────────────────────────────────
  # Job 4: Windows Build Verification (Windows)
  #   → Fast compilation smoke test without node/playwright overhead
  # ───────────────────────────────────────────────
  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App Binary (Smoke Test)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist
          Set-Content frontend/dist/index.html "<html></html>"
          wails build -s -debug -platform windows/amd64 -ldflags "-X grido/internal/service.SupabaseURL=${{ secrets.SUPABASE_URL }} -X grido/internal/service.SupabaseAnonKey=${{ secrets.SUPABASE_ANON_KEY }}"
