name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Download Offline Assets (Fonts & Models)
        working-directory: ./frontend
        shell: powershell
        run: |
          node scripts/download-fonts.js
          .\scripts\download-models.ps1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails generate module

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit Tests & Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium)
        working-directory: ./frontend
        run: npx playwright test --project=chromium

      - name: Run Go Tests
        run: go test . ./internal/...

      - name: Install NSIS Compiler
        shell: powershell
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python Dependencies & Generate Installer Assets
        run: |
          python -m pip install --upgrade pip pillow
          python build/windows/installer/generate_installer_assets.py

      - name: Build Wails App
        run: wails build -platform windows/amd64 -nsis -ldflags "-X grido/internal/service.SupabaseURL=${{ secrets.SUPABASE_URL }} -X grido/internal/service.SupabaseAnonKey=${{ secrets.SUPABASE_ANON_KEY }} -X grido/internal/service.ModalAIKey=${{ secrets.GRIDO_AI_SECRET_KEY }}"

      - name: Prepare Executable Assets
        shell: powershell
        run: |
          if (Test-Path "build\bin\Grido Studio.exe") {
            Copy-Item "build\bin\Grido Studio.exe" "build\bin\GridoStudio.exe" -Force
          }

      - name: Sign Executables via SignPath
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        if: env.SIGNPATH_TOKEN != '' && env.SIGNPATH_ORG != ''
        uses: SignPath/github-action-submit-signing-request@v1.1.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Grido_Studio'
          signing-policy-slug: 'release-policy'
          artifact-configuration-slug: 'initial-version'
          input-artifact-path: 'build/bin/GridoStudio.exe'
          output-artifact-path: 'build/bin/GridoStudio.exe'
          wait-for-completion: true
