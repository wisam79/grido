name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails generate module

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Run Go Tests
        run: go test . ./internal/...

      - name: Build Wails App
        run: wails build -platform windows/amd64

      - name: Sign Windows Executable (Code Signing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERTIFICATE_BASE64) {
            $certPath = "$env:TEMP\cert.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe' sign /f $certPath /p $env:CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "build\bin\GridoStudio.exe"
            Remove-Item $certPath
          } else {
            Write-Output "Code signing certificate not provided. Skipping signature."
          }
