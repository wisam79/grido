name: CI

# ── Security baseline (least privilege): every job runs with read-only
# credentials by default. A job needing more must declare its own
# `permissions:` block (see release.yml pattern: contents:write there).
permissions:
  contents: read
  pull-requests: read

# Single source of truth for toolchain versions (Dependabot watches the
# actions; Go is pinned here, Node is pinned in .nvmrc for local/CI parity).
env:
  GO_VERSION: "1.25.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job -1: Path filter — heavy jobs run only when their inputs changed.
  #   docs-gate has no dependency and ALWAYS runs (mandatory gate).
  #   Safety rationale for the skips:
  #   • frontend also runs on backend changes (bindings/IPC drift tests
  #     live in frontend: ipc-contract-drift).
  #   • backend never runs on frontend-only changes (Go cannot break
  #     from TSX edits; bindings are generated+checked in frontend).
  #   • e2e/webkit run against the mocked Wails bridge, so Go-only
  #     changes cannot affect them.
  #   Docs-only PRs finish in ~1 min instead of ~25 min.
  # ───────────────────────────────────────────────
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: paths-filter diffs push events against `before`,
          # which a shallow clone does not contain.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'internal/**'
              - 'build/**'
              - 'Taskfile.yml'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'app.go'
              - 'system_tray.go'
              - 'devmode_*.go'
            admin:
              - 'admin-web/**'
            workflows:
              - '.github/**'
              - 'scripts/**'

  # ───────────────────────────────────────────────
  # Job 0: Documentation Gate (mandatory)
  #   → يفشل عند انحراف الأرقام المرجعية أو وجود مستند غير مُسجَّل في الجرد.
  #   المرجع: docs/DOCUMENTATION_MAP.md · المهارة: .agents/skills/grido-docs-sync-guard
  # ───────────────────────────────────────────────
  docs-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest
    # Hung gate must fail fast instead of burning the 6h runner default.
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run Documentation Sync Gate
        run: node scripts/docs-gate.mjs --push --ci

      # 2026-09-26: ثلاث هجرات كانت غير قابلة للتطبيق بصمت (OLD داخل RLS + GRANT لتوقيع غير موجود)
      # فبقيت ثغرات مفتوحة؛ هذه البوابة تمنع تكرار الصنف نفسه.
      - name: Lint Database Migrations
        run: node scripts/migration-lint.mjs --self-test && node scripts/migration-lint.mjs

      # 2026-09-26: الإصدار مبعثر في 6 ملفات + الوسم؛ هذه البوابة تمنع تخلّف أي ملف
      # عن build/config.yml (مصدر الحقيقة) — أرخص حماية ضد إصدار "نصف مرفوع".
      - name: Check Release Version Consistency
        run: node scripts/release.mjs --check

  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Fast, pure Node & Go bindings check
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    needs: [changes]
    # Bindings are generated from Go sources, so backend changes re-run this.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-beta.28-cgo0-v2

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0-beta.28) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          fi
          # `wails3 version` يطبع عبر Go println إلى stderr — نحوّله لملف ونفحصه
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0-beta\.28' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0-beta.28 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      # CGO_ENABLED=0: توليد ربطات TypeScript يحلّل شجرة AST فقط ولا يترجم CGo،
      # فيوفّر تثبيت 161 حزمة apt (libgtk-4-dev / libwebkitgtk-6.0-dev).
      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck Frontend
        id: typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend (src + test + e2e)
        id: lint
        working-directory: ./frontend
        run: npm run lint

      - name: Check Frontend Formatting (Prettier)
        id: format
        working-directory: ./frontend
        run: npm run format:check

      - name: Run Frontend Unit Tests & Coverage
        id: unit_tests
        working-directory: ./frontend
        run: npm run test:coverage

      # ملخّص صادق: يطبع نتيجة كل خطوة فعلياً (steps.<id>.outcome) وأرقام
      # التغطية الحقيقية — كان سابقاً جدولاً مكتوباً يدوياً يطبع ✅ مهما كانت النتيجة
      - name: Generate Frontend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "⚡ Frontend Quality & Unit Tests Summary" \
            --row "TypeScript Typecheck=${{ steps.typecheck.outcome }}" \
            --row "ESLint (src + test + e2e, 0 warnings)=${{ steps.lint.outcome }}" \
            --row "Prettier (src + test + e2e)=${{ steps.format.outcome }}" \
            --row "Vitest Unit & Component Tests=${{ steps.unit_tests.outcome }}" \
            --coverage coverage/coverage-summary.json

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  #   → Fast Go verification with staticcheck binary caching
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if [ ! -s /etc/apt/apt-mirrors.txt ]; then
              printf "https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # مطلوب لخطوة الملخّص (node scripts/ci-step-summary.mjs) — كانت المشغّلات
      # تستعمل node المثبّت مسبقاً في الصورة ضمناً، فصار الاعتماد صريحاً
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Cache Go Tools (staticcheck)
        id: cache-staticcheck
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/staticcheck
          key: ${{ runner.os }}-staticcheck-2025.1.1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Prepare placeholder frontend dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html

      - name: Go Vet
        id: go_vet
        run: go vet ./internal/...

      - name: Check Go Formatting (gofmt)
        id: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Pinned release (verified: dominikh/go-tools 2025.1.1) — `@latest`
      # silently moves the toolchain under CI and breaks reproducibility.
      - name: Install staticcheck
        id: install_staticcheck
        if: steps.cache-staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: Run staticcheck
        id: staticcheck
        run: staticcheck ./internal/... .

      - name: Run Go Tests
        id: go_tests
        run: go test -v ./internal/...

      - name: Generate Backend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🛡️ Backend Quality & Go Tests Summary" \
            --row "Go Vet=${{ steps.go_vet.outcome }}" \
            --row "gofmt (0 drift)=${{ steps.gofmt.outcome }}" \
            --row "Staticcheck (0 warnings)=${{ steps.staticcheck.outcome }}" \
            --row "Go Unit & Integration Tests=${{ steps.go_tests.outcome }}"

  # ───────────────────────────────────────────────
  # Job 3: Admin Web Quality (لوحة الإدارة + صفحة الهبوط)
  #   → كان `admin-web` بلا أي بوابة CI (فجوة موثّقة في docs/reviews/09)،
  #     وهذه الوظيفة تشغّل نفس البوابات المحلية: أنواع + lint + بناء إنتاجي.
  # ───────────────────────────────────────────────
  admin-web-quality:
    name: Admin Web Quality
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Admin Web Dependencies
        working-directory: ./admin-web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck Admin Web
        id: typecheck
        working-directory: ./admin-web
        run: npx tsc -b

      - name: Lint Admin Web
        id: lint
        working-directory: ./admin-web
        run: npm run lint

      - name: Test Admin Web (Vitest)
        id: test
        working-directory: ./admin-web
        run: npm test

      - name: Build Admin Web (production)
        id: build
        working-directory: ./admin-web
        run: npm run build

      - name: Generate Admin Web Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🖥️ Admin Web Quality Summary" \
            --row "TypeScript Typecheck=${{ steps.typecheck.outcome }}" \
            --row "Oxlint (0 warnings)=${{ steps.lint.outcome }}" \
            --row "Vitest Unit Tests=${{ steps.test.outcome }}" \
            --row "Production Build=${{ steps.build.outcome }}"

  # ───────────────────────────────────────────────
  # Job 4: Playwright E2E Tests (Linux - 4 Shards Parallel Matrix)
  #   → 4 parallel shards executing 41 tests simultaneously
  # ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: [changes]
    # E2E runs against the mocked Wails bridge, so Go-only changes cannot
    # affect it — frontend or workflow changes re-run it.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-beta.28-cgo0-v2

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0-beta.28) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          fi
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0-beta\.28' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0-beta.28 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      # CGO_ENABLED=0: يولّد ربطات TypeScript من AST مباشرة دون الحاجة لحزم GTK4/WebKitGTK
      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Browsers
        id: install_browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install chromium

      - name: Run E2E Tests (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: e2e
        working-directory: ./frontend
        run: npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate E2E Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🎭 Playwright E2E (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})" \
            --note "المحرك: Chromium Headless. محرك الإصدار الحقيقي (WebKit) يُفحص في مهمة WebKit Smoke بمخطط @smoke." \
            --row "Playwright Chromium Suite=${{ steps.e2e.outcome }}" \
            --row "Chromium Browsers Installation=${{ steps.install_browsers.outcome }}" \
            --row "Wails v3 Bridge Mock=${{ steps.generate_bindings.outcome }}"

  # ───────────────────────────────────────────────
  # Job 5: Windows Build Verification (Windows)
  #   → Real Wails v3 production binary build with Go Build Caching
  # ───────────────────────────────────────────────
  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    needs: [changes]
    # Compiles Go + frontend together — any code change re-runs it.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go Build Cache (Windows)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-beta.28-v1

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0-beta.28): مفتاح الكاش يحمل رقم
      #    الإصدار فيُبطَل أي كاش قديم، والتحقق أدناه يكشف أي تراجع فعلي.
      # `shell: pwsh` (PowerShell 7) لا Windows PowerShell 5.1: الأخير يقرأ ملف
      # السكربت بترميز ANSI فيحوّل أي نص غير لاتيني (عربي هنا) إلى بايتات تكسر
      # المحلل (ParserError: Unexpected token) قبل تنفيذ أي سطر. الرسائل داخل
      # هذا السطر تبقى ASCII أيضاً كطبقة أمان ثانية.
      - name: Install Wails3 CLI
        shell: pwsh
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          }
          # wails3 version prints via Go println to stderr -> capture both streams
          $verFile = Join-Path $env:TEMP 'wails3-version.txt'
          wails3 version > $verFile 2>&1
          $v = (Get-Content $verFile -Raw).Trim()
          Write-Host "wails3 version => $v"
          if ($v -notmatch '3\.0\.0-beta\.28') {
            throw "wails3 CLI version mismatch: expected v3.0.0-beta.28 (actual '$v'). Clear the go/bin cache and retry."
          }

      - name: Build Wails v3 App Binary (Smoke Test)
        id: build
        shell: powershell
        env:
          CGO_ENABLED: "1"
          APP_VERSION: "v0.0.0-ci"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: wails3 task build

      # قراءة الميتاداتا هنا تمر بنفس مسار Windows/.NET: الترجمة (lang+codepage) ثم
      # جدول نصوص مطابق لها. لذلك يفشل هذا الفحص إذا عاد `build/windows/info.json`
      # لمفتاح محايد (0000) أو فقد المفتاح النصي `FileVersion` — وهو ما يفعله
      # `wails3 update build-assets` عند إعادة توليد الأصول.
      - name: Verify EXE Branding Metadata
        id: branding
        shell: powershell
        run: |
          $exe = 'bin\GridoStudio.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $required = @('ProductName','CompanyName','FileDescription','FileVersion')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($v.$_) })
          if ($missing.Count -gt 0) {
            $hint = 'Windows resolves version strings only when build/windows/info.json uses an LCID table key (e.g. "0409", never the neutral "0000") AND declares the string key "FileVersion"; otherwise .NET/Explorer retry with fallback codepages that wipe every value.'
            throw ("EXE metadata empty: {0} - {1}" -f ($missing -join ', '), $hint)
          }
          Write-Host "Product='$($v.ProductName)' Company='$($v.CompanyName)' Version='$($v.FileVersion)' Description='$($v.FileDescription)' Language='$($v.Language)'"

      - name: Run Windows Native Integration Tests
        id: native_tests
        shell: powershell
        env:
          CGO_ENABLED: "1"
        run: go test -v ./internal/service -run "TestMediaService_CrossPlatformAndWindowsPaths|TestPrintService_HiRes300DPI_A4_FullScaleVerification|TestPrintNative_.*"

      - name: Generate Windows Build Summary
        if: always()
        shell: bash
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🪟 Windows Build Verification Summary" \
            --note "الهدف: Windows x64 (Wails v3 + CGO) مع اختبارات مسارات ويندوز ودقة 300 DPI." \
            --row "Compilation (wails3 task build)=${{ steps.build.outcome }}" \
            --row "EXE Branding Metadata=${{ steps.branding.outcome }}" \
            --row "Windows Native Integration Tests=${{ steps.native_tests.outcome }}"

  # ───────────────────────────────────────────────
  # Job 6: WebKit Smoke (محرك الإصدار الحقيقي)
  #   WebKitGTK (لينكس) و WebView2 (ويندوز) هي محركات الإصدار الفعلية،
  #   وWebKit أقرب محرك إليها في Playwright — بينما بقية الحزمة تعمل على
  #   chromium فقط. تُشغَّل مواصفات @smoke فقط (engine-smoke.spec.ts) وهي ضحلة
  #   ومستقرة ومستقلّة عن وضع الكانفاس: إقلاع وترسيم الكانفاس (سياق 2d)،
  #   وCtrl+K يفتح لوحة الأدوات وEsc يغلقها، واختيار أداة من الشريط يفتح لوحتها.
  #   أُثبتت على CI (نجاح سحابي متكرر) فصارت مُعطِّلة: فشلها يفشل البناء.
  # ───────────────────────────────────────────────
  webkit-smoke:
    name: WebKit Smoke (Shipping Engine)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-beta.28-cgo0-v2

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0-beta.28) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          fi
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0-beta\.28' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0-beta.28 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # كان WebKit يُنزَّل (~100MB+) في كل تشغيل بلا كاش — الآن يُخزَّن
      # بنفس نمط Chromium (مفتاح مقفل على package-lock).
      - name: Cache Playwright WebKit Browser
        id: cache-playwright-webkit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-webkit-

      - name: Install Playwright WebKit OS Dependencies
        working-directory: ./frontend
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if [ ! -s /etc/apt/apt-mirrors.txt ]; then
              printf "https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
          npx playwright install-deps webkit

      - name: Install Playwright WebKit Browser
        id: install_browsers
        if: steps.cache-playwright-webkit.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install webkit

      - name: Run WebKit Smoke Tests (@smoke)
        id: webkit
        working-directory: ./frontend
        run: npx playwright test --project=webkit --grep @smoke

      - name: Upload WebKit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate WebKit Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🧭 WebKit Smoke (Shipping Engine) Summary" \
            --note "WebKit أقرب محرك إلى WebKitGTK/WebView2 الذي يُشحن به التطبيق. الفحص مُلزم: فشله يفشل البناء." \
            --row "Playwright @smoke on WebKit=${{ steps.webkit.outcome }}" \
            --row "WebKit Browser Installation=${{ steps.install_browsers.outcome }}"
