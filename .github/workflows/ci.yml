name: CI

# ── Security baseline (least privilege): every job runs with read-only
# credentials by default. A job needing more must declare its own
# `permissions:` block (see release.yml pattern: contents:write there).
permissions:
  contents: read
  pull-requests: read

# Single source of truth for toolchain versions (Dependabot watches the
# actions; Go is pinned here, Node is pinned in .nvmrc for local/CI parity).
env:
  # 1.26.11 — govulncheck gate: GO-2026-6859 (net/http) fixed in 1.26.11؛
  # ويتضمن إصلاحَي GO-2026-6809/6617 من 1.26.10/1.26.9. لا تنزل دون 1.26.11.
  GO_VERSION: "1.26.11"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every gated check and full Chromium/Firefox/WebKit suites on Linux and Windows
        type: boolean
        default: true
      expected_sha:
        description: Exact published test-ref SHA required for full manual acceptance
        type: string
        required: false
  workflow_call:
    inputs:
      force_full:
        description: Force complete isolated CI acceptance checks
        type: boolean
        default: true
  schedule:
    # فحص سباقات وتغطية الخلفية أسبوعياً خارج المسار السريع لكل push.
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job -1: Path filter — heavy jobs run only when their inputs changed.
  #   docs-gate has no dependency and ALWAYS runs (mandatory gate).
  #   Safety rationale for the skips:
  #   • frontend also runs on backend changes (bindings/IPC drift tests
  #     live in frontend: ipc-contract-drift).
  #   • backend never runs on frontend-only changes (Go cannot break
  #     from TSX edits; bindings are generated+checked in frontend).
  #   • e2e/webkit run against the mocked Wails bridge, so Go-only
  #     changes cannot affect them.
  #   Docs-only PRs finish in ~1 min instead of ~25 min.
  # ───────────────────────────────────────────────
  changes:
    name: Detect Changed Areas
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      frontend: ${{ inputs.force_full && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ inputs.force_full && 'true' || steps.filter.outputs.backend }}
      admin: ${{ inputs.force_full && 'true' || steps.filter.outputs.admin }}
      modal_ai: ${{ inputs.force_full && 'true' || steps.filter.outputs.modal_ai }}
      workflows: ${{ inputs.force_full && 'true' || steps.filter.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: paths-filter diffs push events against `before`,
          # which a shallow clone does not contain.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'internal/**'
              - 'build/**'
              - 'Taskfile.yml'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'app.go'
              - 'system_tray.go'
              - 'devmode_*.go'
            admin:
              - 'admin-web/**'
            modal_ai:
              - 'modal_ai/**'
            workflows:
              - '.github/**'
              - 'scripts/**'

  # ───────────────────────────────────────────────
  # Job 0: Documentation Gate (mandatory)
  #   → يفشل عند انحراف الأرقام المرجعية أو وجود مستند غير مُسجَّل في الجرد.
  #   المرجع: docs/DOCUMENTATION_MAP.md · المهارة: .agents/skills/grido-docs-sync-guard
  # ───────────────────────────────────────────────
  docs-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest
    # Hung gate must fail fast instead of burning the 6h runner default.
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run Documentation Sync Gate
        run: node scripts/docs-gate.mjs --push --ci

      - name: Verify acceptance evidence gate (targeted synthetic reporter tests)
        run: node --test scripts/e2e/report-selftest.test.mjs

      # 2026-09-26: ثلاث هجرات كانت غير قابلة للتطبيق بصمت (OLD داخل RLS + GRANT لتوقيع غير موجود)
      # فبقيت ثغرات مفتوحة؛ هذه البوابة تمنع تكرار الصنف نفسه.
      - name: Lint Database Migrations
        run: node scripts/migration-lint.mjs --self-test && node scripts/migration-lint.mjs

      # 2026-09-26: الإصدار مبعثر في 6 ملفات + الوسم؛ هذه البوابة تمنع تخلّف أي ملف
      # عن build/config.yml (مصدر الحقيقة) — أرخص حماية ضد إصدار "نصف مرفوع".
      - name: Check Release Version Consistency
        run: node scripts/release.mjs --check

      - name: Check Windows Installer Data-Retention Policy
        run: node scripts/installer-policy-check.mjs

  # Python declarations and mocked pipeline tests only: no Modal image build,
  # model downloads, benchmarks, account access, or production secrets.
  validate-modal-ai:
    name: Modal AI Unit Tests (Python 3.10)
    runs-on: ubuntu-latest
    needs: [changes]
    if: inputs.force_full || github.event_name == 'workflow_dispatch' || needs.changes.outputs.modal_ai == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            modal_ai/requirements-runtime.txt
            modal_ai/requirements-tooling.txt

      - name: Install Pinned Python Dependencies
        run: |
          python -m pip install -r modal_ai/requirements-runtime.txt -r modal_ai/requirements-tooling.txt
          python -m pip check

      - name: Run Modal AI Unit Tests (No Models or Cloud Access)
        run: python -m unittest modal_ai.test_upscaler -v

  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Fast, pure Node & Go bindings check
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    needs: [changes]
    # Bindings are generated from Go sources, so backend changes re-run this.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-cgo0-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          fi
          # `wails3 version` يطبع عبر Go println إلى stderr — نحوّله لملف ونفحصه
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      # CGO_ENABLED=0: توليد ربطات TypeScript يحلّل شجرة AST فقط ولا يترجم CGo،
      # فيوفّر تثبيت 161 حزمة apt (libgtk-4-dev / libwebkitgtk-6.0-dev).
      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # 🔒 بوابة ثغرات الاعتماديات الإنتاجية — تفشل عند high وأعلى
      # (الحالة المرجعية 2026-11-01: 0 ثغرات، أُغلقت xlsx في SECURITY_NOTICE.md).
      - name: npm audit (production dependencies)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck Frontend
        id: typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Typecheck Actual Acceptance Specs and Config
        if: inputs.force_full
        run: node frontend/node_modules/typescript/bin/tsc --noEmit -p frontend/tsconfig.acceptance.json

      - name: Lint Actual Acceptance Specs and Config
        if: inputs.force_full
        working-directory: frontend
        run: npx --no-install eslint e2e-acceptance playwright.acceptance.config.ts --report-unused-disable-directives --max-warnings 0

      - name: Lint Frontend (src + test + e2e)
        id: lint
        working-directory: ./frontend
        run: npm run lint

      - name: Check Frontend Formatting (Prettier)
        id: format
        working-directory: ./frontend
        run: npm run format:check

      - name: Run Frontend Unit Tests & Coverage
        id: unit_tests
        working-directory: ./frontend
        run: npm run test:coverage

      # ملخّص صادق: يطبع نتيجة كل خطوة فعلياً (steps.<id>.outcome) وأرقام
      # التغطية الحقيقية — كان سابقاً جدولاً مكتوباً يدوياً يطبع ✅ مهما كانت النتيجة
      - name: Generate Frontend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "⚡ Frontend Quality & Unit Tests Summary" \
            --row "TypeScript Typecheck=${{ steps.typecheck.outcome }}" \
            --row "ESLint (src + test + e2e, 0 warnings)=${{ steps.lint.outcome }}" \
            --row "Prettier (src + test + e2e)=${{ steps.format.outcome }}" \
            --row "Vitest Unit & Component Tests=${{ steps.unit_tests.outcome }}" \
            --coverage coverage/coverage-summary.json

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  #   → Fast Go verification with staticcheck binary caching
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if [ ! -s /etc/apt/apt-mirrors.txt ]; then
              printf "https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # مطلوب لخطوة الملخّص (node scripts/ci-step-summary.mjs) — كانت المشغّلات
      # تستعمل node المثبّت مسبقاً في الصورة ضمناً، فصار الاعتماد صريحاً
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Cache Go Tools (staticcheck)
        id: cache-staticcheck
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/staticcheck
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-staticcheck-v0.8.2

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Prepare placeholder frontend dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html

      - name: Go Vet
        id: go_vet
        run: go vet ./internal/...

      - name: Check Go Formatting (gofmt)
        id: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Pinned release (verified: dominikh/go-tools v0.8.2 supporting Go 1.26+) — `@latest`
      # silently moves the toolchain under CI and breaks reproducibility.
      - name: Install staticcheck
        id: install_staticcheck
        if: steps.cache-staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        id: staticcheck
        run: staticcheck ./internal/... .

      - name: Cache Go Tools (govulncheck)
        id: cache-govulncheck
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-govulncheck-v1.1.4

      # Pinned release (golang.org/x/vuln v1.1.4) — نفس سياسة staticcheck:
      # `@latest` يحرك العدّة تحت CI بلا انحراف قابل للتتبع.
      - name: Install govulncheck
        id: install_govulncheck
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck (Vulnerability Scan)
        id: govulncheck
        run: govulncheck ./internal/... .

      - name: Run Go Tests
        id: go_tests
        run: go test -v ./internal/...

      - name: Generate Backend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🛡️ Backend Quality & Go Tests Summary" \
            --row "Go Vet=${{ steps.go_vet.outcome }}" \
            --row "gofmt (0 drift)=${{ steps.gofmt.outcome }}" \
            --row "Staticcheck (0 warnings)=${{ steps.staticcheck.outcome }}" \
            --row "govulncheck (0 known vulns)=${{ steps.govulncheck.outcome }}" \
            --row "Go Unit & Integration Tests=${{ steps.go_tests.outcome }}"

  backend-race-coverage:
    name: Backend Race & Coverage (Scheduled)
    if: inputs.force_full || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare placeholder frontend dist for go:embed
        run: |
          mkdir -p frontend/dist
          printf '<html></html>\n' > frontend/dist/index.html

      - name: Run Go Race Detector with Coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Print Coverage Summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-race-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  print-performance-report:
    name: Print Performance & RSS Report (Windows)
    if: inputs.force_full || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Capture Runner Environment
        id: environment
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join '; '
          if ([string]::IsNullOrWhiteSpace($cpu)) { $cpu = $env:PROCESSOR_IDENTIFIER }
          "GRIDO_PRINT_PERF_CPU=$cpu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "timestamp_utc=$([DateTime]::UtcNow.ToString('o'))"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_name=$env:RUNNER_NAME"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "cpu=$cpu"
            "logical_processors=$env:NUMBER_OF_PROCESSORS"
            "go=$(go version)"
            "go_env=$((go env GOOS GOARCH GOVERSION CGO_ENABLED) -join ' ')"
          ) | Set-Content -Path "$env:RUNNER_TEMP\print-environment.txt" -Encoding utf8

      # This is deliberately report-only: it validates functional outputs and
      # required metrics, but has no invented duration/RSS regression threshold.
      - name: Collect Print Performance Baseline
        id: print_bench
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GRIDO_PRINT_PERF_REPORT: "1"
          GRIDO_PRINT_PERF_APP_DIR: ${{ runner.temp }}\print-performance
        run: |
          New-Item -ItemType Directory -Path $env:GRIDO_PRINT_PERF_APP_DIR -Force | Out-Null
          go test -v ./internal/service -run '^TestPrintPerfBaselineReport$' -count=1 -timeout=25m 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\print-probe.log"
          $goTestExit = $LASTEXITCODE
          if ($goTestExit -ne 0) { exit $goTestExit }
          Copy-Item "$env:RUNNER_TEMP\print-environment.txt" "$env:GRIDO_PRINT_PERF_APP_DIR\print-environment.txt" -Force
          Copy-Item "$env:RUNNER_TEMP\print-probe.log" "$env:GRIDO_PRINT_PERF_APP_DIR\print-probe.log" -Force

      - name: Publish Print Performance Summary
        if: always()
        shell: pwsh
        env:
          REPORT_DIR: ${{ runner.temp }}\print-performance
        run: |
          @(
            "## Print performance & RSS baseline"
            ""
            "> Report-only scheduled/manual probe. No timing or RSS threshold is enforced."
            ""
            "- Runner: ``$env:RUNNER_OS/$env:RUNNER_ARCH``"
            "- Go: ``$(go version)``"
            "- Probe: **${{ steps.print_bench.outcome }}**"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $report = Join-Path $env:REPORT_DIR 'print-bench.txt'
          $jsonReport = Join-Path $env:REPORT_DIR 'print-bench.json'
          $environmentReport = Join-Path $env:REPORT_DIR 'print-environment.json'
          if (Test-Path $report) {
            @("", '```text') | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Get-Content $report | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else {
            "- Report file: **missing**" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          if ('${{ steps.print_bench.outcome }}' -eq 'success' -and
              (-not (Test-Path $report) -or -not (Test-Path $jsonReport) -or -not (Test-Path $environmentReport))) {
            throw 'Print performance probe completed without all required report artifacts.'
          }

      - name: Upload Print Performance Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: print-performance-${{ runner.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\print-performance\print-bench.txt
            ${{ runner.temp }}\print-performance\print-bench.json
            ${{ runner.temp }}\print-performance\print-environment.json
            ${{ runner.temp }}\print-performance\print-environment.txt
            ${{ runner.temp }}\print-performance\print-probe.log
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────
  # Job 3: Admin Web Quality (لوحة الإدارة + صفحة الهبوط)
  #   → كان `admin-web` بلا أي بوابة CI (فجوة موثّقة في docs/reviews/09)،
  #     وهذه الوظيفة تشغّل نفس البوابات المحلية: أنواع + lint + بناء إنتاجي.
  # ───────────────────────────────────────────────
  admin-web-quality:
    name: Admin Web Quality
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Admin Web Dependencies
        working-directory: ./admin-web
        run: npm ci --prefer-offline --no-audit --no-fund

      # 🔒 بوابة ثغرات الاعتماديات الإنتاجية — تفشل عند high وأعلى.
      - name: npm audit (production dependencies)
        working-directory: ./admin-web
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck Admin Web
        id: typecheck
        working-directory: ./admin-web
        run: npx tsc -b

      - name: Lint Admin Web
        id: lint
        working-directory: ./admin-web
        run: npm run lint

      - name: Test Admin Web (Vitest)
        id: test
        working-directory: ./admin-web
        run: npm test -- --exclude 'e2e/**'

      - name: Build Admin Web (production)
        id: build
        working-directory: ./admin-web
        run: npm run build

      # Smoke uses only the independent local Vite server + intercepted APIs.
      # Production build above and shared job credentials remain unchanged.
      - name: Cache Admin Playwright Browsers
        id: cache-admin-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-admin-playwright-${{ hashFiles('admin-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-admin-playwright-
            ${{ runner.os }}-playwright-

      - name: Install Admin Chromium Browser
        if: steps.cache-admin-playwright.outputs.cache-hit != 'true'
        working-directory: ./admin-web
        run: npx --no-install playwright install chromium

      - name: Install Admin Chromium System Dependencies
        working-directory: ./admin-web
        run: npx --no-install playwright install-deps chromium

      - name: Run Admin UX Smoke (Offline Fixtures)
        id: ux_smoke
        working-directory: ./admin-web
        run: npx --no-install playwright test --config=playwright.config.ts --project=chromium

      - name: Upload Admin UX Smoke Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-ux-smoke-evidence
          path: |
            admin-web/playwright-report/
            admin-web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate Admin Web Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🖥️ Admin Web Quality Summary" \
            --row "TypeScript Typecheck=${{ steps.typecheck.outcome }}" \
            --row "Oxlint (0 warnings)=${{ steps.lint.outcome }}" \
            --row "Vitest Unit Tests=${{ steps.test.outcome }}" \
            --row "Production Build=${{ steps.build.outcome }}" \
            --row "Offline Admin UX Smoke=${{ steps.ux_smoke.outcome }}"

  # ───────────────────────────────────────────────
  # Job 4: Playwright E2E Tests (Linux - 4 Shards Parallel Matrix)
  #   → 4 parallel shards executing 75 tests simultaneously
  # ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: [changes]
    # E2E runs against the mocked Wails bridge, so Go-only changes cannot
    # affect it — frontend or workflow changes re-run it.
    if: ${{ !inputs.force_full && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-cgo0-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          fi
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      # CGO_ENABLED=0: يولّد ربطات TypeScript من AST مباشرة دون الحاجة لحزم GTK4/WebKitGTK
      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Browsers
        id: install_browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install chromium

      - name: Run E2E Tests (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: e2e
        working-directory: ./frontend
        run: npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate E2E Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🎭 Playwright E2E (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})" \
            --note "المحرك: Chromium Headless. محرك الإصدار الحقيقي (WebKit) يُفحص في مهمة WebKit Smoke بمخطط @smoke." \
            --row "Playwright Chromium Suite=${{ steps.e2e.outcome }}" \
            --row "Chromium Browsers Installation=${{ steps.install_browsers.outcome }}" \
            --row "Wails v3 Bridge Mock=${{ steps.generate_bindings.outcome }}"

  # ───────────────────────────────────────────────
  # Job 5: Windows Build Verification (Windows)
  #   → Real Wails v3 production binary build with Go Build Caching
  # ───────────────────────────────────────────────
  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    needs: [changes]
    # Compiles Go + frontend together — any code change re-runs it.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go Build Cache (Windows)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-v1

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0): مفتاح الكاش يحمل رقم
      #    الإصدار فيُبطَل أي كاش قديم، والتحقق أدناه يكشف أي تراجع فعلي.
      # `shell: pwsh` (PowerShell 7) لا Windows PowerShell 5.1: الأخير يقرأ ملف
      # السكربت بترميز ANSI فيحوّل أي نص غير لاتيني (عربي هنا) إلى بايتات تكسر
      # المحلل (ParserError: Unexpected token) قبل تنفيذ أي سطر. الرسائل داخل
      # هذا السطر تبقى ASCII أيضاً كطبقة أمان ثانية.
      - name: Install Wails3 CLI
        shell: pwsh
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          }
          # wails3 version prints via Go println to stderr -> capture both streams
          $verFile = Join-Path $env:TEMP 'wails3-version.txt'
          wails3 version > $verFile 2>&1
          $v = (Get-Content $verFile -Raw).Trim()
          Write-Host "wails3 version => $v"
          if ($v -notmatch '3\.0\.0') {
            throw "wails3 CLI version mismatch: expected v3.0.0 (actual '$v'). Clear the go/bin cache and retry."
          }

      - name: Build Wails v3 App Binary (Smoke Test)
        id: build
        shell: powershell
        env:
          CGO_ENABLED: "1"
          APP_VERSION: "v0.0.0-ci"
          # Inert loopback build values, not repository secrets. This smoke binary
          # is sandbox-only, unsigned and never uploaded as a release asset.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-sandbox-nonpublishable
        run: wails3 task build

      # قراءة الميتاداتا هنا تمر بنفس مسار Windows/.NET: الترجمة (lang+codepage) ثم
      # جدول نصوص مطابق لها. لذلك يفشل هذا الفحص إذا عاد `build/windows/info.json`
      # لمفتاح محايد (0000) أو فقد المفتاح النصي `FileVersion` — وهو ما يفعله
      # `wails3 update build-assets` عند إعادة توليد الأصول.
      - name: Verify EXE Branding Metadata
        id: branding
        shell: powershell
        run: |
          $exe = 'bin\GridoStudio.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $required = @('ProductName','CompanyName','FileDescription','FileVersion')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($v.$_) })
          if ($missing.Count -gt 0) {
            $hint = 'Windows resolves version strings only when build/windows/info.json uses an LCID table key (e.g. "0409", never the neutral "0000") AND declares the string key "FileVersion"; otherwise .NET/Explorer retry with fallback codepages that wipe every value.'
            throw ("EXE metadata empty: {0} - {1}" -f ($missing -join ', '), $hint)
          }
          Write-Host "Product='$($v.ProductName)' Company='$($v.CompanyName)' Version='$($v.FileVersion)' Description='$($v.FileDescription)' Language='$($v.Language)'"

      - name: Run Windows Native Integration Tests
        id: native_tests
        shell: powershell
        env:
          CGO_ENABLED: "1"
        run: |
          # Keep the established native integration selection and add every pure
          # GDI seam test. The anchored prefix excludes TestGDILive_* by design,
          # so hosted runners never require an installed/default printer.
          go test -v ./internal/service -run "TestMediaService_CrossPlatformAndWindowsPaths|TestPrintService_HiRes300DPI_A4_FullScaleVerification|TestPrintNative_.*"
          go test -v ./internal/service -run "^TestGDIPure_"

      - name: Generate Windows Build Summary
        if: always()
        shell: bash
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🪟 Windows Build Verification Summary" \
            --note "الهدف: Windows x64 (Wails v3 + CGO) مع اختبارات مسارات ويندوز ودقة 300 DPI." \
            --row "Compilation (wails3 task build)=${{ steps.build.outcome }}" \
            --row "EXE Branding Metadata=${{ steps.branding.outcome }}" \
            --row "Windows Native Integration Tests=${{ steps.native_tests.outcome }}"

  # ───────────────────────────────────────────────
  # Job 6: WebKit Smoke (محرك الإصدار الحقيقي)
  #   WebKitGTK (لينكس) و WebView2 (ويندوز) هي محركات الإصدار الفعلية،
  #   وWebKit أقرب محرك إليها في Playwright — بينما بقية الحزمة تعمل على
  #   chromium فقط. تُشغَّل مواصفات @smoke فقط (engine-smoke.spec.ts) وهي ضحلة
  #   ومستقرة ومستقلّة عن وضع الكانفاس: إقلاع وترسيم الكانفاس (سياق 2d)،
  #   وCtrl+K يفتح لوحة الأدوات وEsc يغلقها، واختيار أداة من الشريط يفتح لوحتها.
  #   أُثبتت على CI (نجاح سحابي متكرر) فصارت مُعطِّلة: فشلها يفشل البناء.
  # ───────────────────────────────────────────────
  webkit-smoke:
    name: WebKit Smoke (Shipping Engine)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !inputs.force_full && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-wails-3.0.0-cgo0-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # 🔒 تثبيت صارم لإصدار Wails v3 (v3.0.0) مع CGO_ENABLED=0 لتجنب ربط
      #    internal/operatingsystem/webkit_linux.go بمكتبات libwebkitgtk-6.0.so.4.
      - name: Install Wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          fi
          wails3 version > "$RUNNER_TEMP/wails3-version.txt" 2>&1 || true
          echo "wails3 version => $(cat "$RUNNER_TEMP/wails3-version.txt")"
          if ! grep -q '3\.0\.0' "$RUNNER_TEMP/wails3-version.txt"; then
            echo "::error::إصدار wails3 CLI لا يطابق المثبّت v3.0.0 — امسح كاش go/bin وأعد المحاولة."
            exit 1
          fi

      - name: Generate Wails v3 Bindings
        id: generate_bindings
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # كان WebKit يُنزَّل (~100MB+) في كل تشغيل بلا كاش — الآن يُخزَّن
      # بنفس نمط Chromium (مفتاح مقفل على package-lock).
      - name: Cache Playwright WebKit Browser
        id: cache-playwright-webkit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-webkit-

      - name: Install Playwright WebKit OS Dependencies
        working-directory: ./frontend
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if [ ! -s /etc/apt/apt-mirrors.txt ]; then
              printf "https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
          npx playwright install-deps webkit

      - name: Install Playwright WebKit Browser
        id: install_browsers
        if: steps.cache-playwright-webkit.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install webkit

      - name: Run WebKit Smoke Tests (@smoke)
        id: webkit
        working-directory: ./frontend
        run: npx playwright test --project=webkit --grep @smoke

      - name: Upload WebKit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate WebKit Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🧭 WebKit Smoke (Shipping Engine) Summary" \
            --note "WebKit أقرب محرك إلى WebKitGTK/WebView2 الذي يُشحن به التطبيق. الفحص مُلزم: فشله يفشل البناء." \
            --row "Playwright @smoke on WebKit=${{ steps.webkit.outcome }}" \
            --row "WebKit Browser Installation=${{ steps.install_browsers.outcome }}"

  # Full browser acceptance is opt-in on normal CI, mandatory for force_full.
  # Existing mocked Wails suite only: this must never be called actual backend acceptance.
  e2e-full:
    name: Full E2E ${{ matrix.os }} ${{ matrix.project }} ${{ matrix.shard }}/4
    if: inputs.force_full
    needs: [changes]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04]
        project: [chromium]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned Wails bindings generator
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
          mkdir -p frontend/dist
          printf '<html></html>\n' > frontend/dist/index.html
      - name: Generate exact source bindings
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: wails3 generate bindings -ts -clean=true
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --prefer-offline --no-audit --no-fund
      - name: Cache browser binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-full-playwright-${{ matrix.project }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install selected browser and OS dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps ${{ matrix.project }}
      - name: Execute exact full-project shard with strict evidence
        shell: bash
        run: |
          node scripts/e2e/report-run.mjs \
            --root frontend --config playwright.config.ts \
            --lane legacy-${{ runner.os == 'Windows' && 'windows' || 'linux' }} \
            --project ${{ matrix.project }} --shard ${{ matrix.shard }}/4 \
            --fixture-kind mocked-wails \
            --fixture-input frontend/e2e/helpers/wails-mock.ts \
            --fixture-input frontend/e2e/helpers/wails-v3-bridge.ts \
            --output "$RUNNER_TEMP/evidence"
      - name: Upload complete shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-legacy-${{ runner.os }}-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7

  full-gate:
    name: Full CI gate (zero skipped required jobs)
    if: always() && inputs.force_full
    needs: [changes, docs-gate, validate-modal-ai, validate-frontend, validate-backend, backend-race-coverage, print-performance-report, admin-web-quality, windows-build, e2e-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Free runner disk space for multi-lane evidence verification
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Download all full-suite shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acceptance-legacy-*
          path: downloaded-evidence
          merge-multiple: false
      - name: Verify case sets, shard union, hashes and required job results
        if: always()
        run: |
          node scripts/e2e/report-merge.mjs --input downloaded-evidence --output merged-evidence --sha "${{ github.sha }}" \
            --expected legacy-linux/chromium:4 \
            --job changes=${{ needs.changes.result }} --job docs=${{ needs.docs-gate.result }} \
            --job modal-unit=${{ needs.validate-modal-ai.result }} --job frontend=${{ needs.validate-frontend.result }} \
            --job backend=${{ needs.validate-backend.result }} --job race=${{ needs.backend-race-coverage.result }} \
            --job print-report=${{ needs.print-performance-report.result }} --job admin=${{ needs.admin-web-quality.result }} \
            --job windows-build=${{ needs.windows-build.result }} --job full-e2e=${{ needs.e2e-full.result }}
      - name: Reclaim raw download space after manifest and SHA-256 verification
        if: always()
        shell: bash
        run: rm -rf downloaded-evidence
      - name: Install report merger dependencies
        if: always()
        run: npm --prefix frontend ci --prefer-offline --no-audit --no-fund
      - name: Merge all browser blobs into HTML, JSON and JUnit
        if: always()
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../merged-evidence/html
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../merged-evidence/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../merged-evidence/results.xml
        run: npx --no-install playwright merge-reports --config=../scripts/e2e/report-merge.config.mjs --reporter=html,json,junit ../merged-evidence/blob
      - name: Upload full CI summary and merged reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-full-summary
          path: merged-evidence/
          if-no-files-found: error
          retention-days: 7

  # Registered ci.yml can dispatch the approved branch before a new workflow
  # exists on the default branch. These jobs never call a reusable workflow.
  acceptance-preflight:
    name: Enforce published test-ref and acceptance source SHA
    if: github.event_name == 'workflow_dispatch' && inputs.force_full && inputs.expected_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate immutable dispatch contract
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/test/* ]] || { printf '%s\n' 'Acceptance requires an approved published test/* branch, never main/tags.'; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { printf '%s\n' 'expected_sha must be an exact commit SHA.'; exit 1; }
          [[ "${EXPECTED_SHA,,}" == "${GITHUB_SHA,,}" ]] || { printf '%s\n' 'Dispatch ref changed or SHA mismatch; no actual acceptance builds started.'; exit 1; }
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check acceptance source contracts exist
        shell: bash
        run: |
          for file in scripts/e2e/report-run.mjs scripts/e2e/report-merge.mjs scripts/e2e/acceptance-manifest.schema.json scripts/e2e/runtime-process.mjs scripts/e2e/supabase-fixture.mjs frontend/playwright.acceptance.config.ts frontend/tsconfig.acceptance.json admin-web/playwright.acceptance.config.ts; do
            test -f "$file" || { printf 'Missing owner contract: %s\n' "$file"; exit 1; }
          done

  acceptance-linux:
    name: Real local Supabase + embedded Go server + actual admin/phone
    if: github.event_name == 'workflow_dispatch' && inputs.force_full && inputs.expected_sha != ''
    needs: [acceptance-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      CGO_ENABLED: "1"
      GRIDO_ACCEPTANCE_LANE: server
    steps:
      - name: Set isolated server binary path (not a credential)
        shell: bash
        run: printf 'GRIDO_E2E_BINARY=%s/GridoStudio-acceptance-server\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-web/package-lock.json
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install same-main CGO build dependencies and local fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev postgresql-client
          docker info >/dev/null
      - name: Install pinned Supabase CLI outside fixture directory
        shell: bash
        run: |
          download="$RUNNER_TEMP/supabase-cli-download"
          unpack="$RUNNER_TEMP/supabase-cli-extracted"
          mkdir "$download" "$unpack"
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.81.3/supabase_linux_amd64.tar.gz --output "$download/supabase_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.81.3/supabase_2.81.3_checksums.txt --output "$download/checksums.txt"
          node scripts/e2e/report-toolcheck.mjs --archive "$download/supabase_linux_amd64.tar.gz" --checksums "$download/checksums.txt" --name supabase_linux_amd64.tar.gz
          tar -xzf "$download/supabase_linux_amd64.tar.gz" -C "$unpack" supabase
          chmod +x "$unpack/supabase"
          printf '%s\n' "$unpack" >> "$GITHUB_PATH"
      - name: Install pinned Wails bindings generator
        env:
          CGO_ENABLED: "0"
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
          mkdir -p frontend/dist
          printf '<html></html>\n' > frontend/dist/index.html
      - name: Generate production bindings from exact sources
        env:
          CGO_ENABLED: "0"
        run: wails3 generate bindings -ts -clean=true
      - name: Install frontend and independent admin dependencies
        run: |
          npm --prefix frontend ci --prefer-offline --no-audit --no-fund
          npm --prefix admin-web ci --prefer-offline --no-audit --no-fund
      - name: Typecheck actual acceptance specs and config
        run: node frontend/node_modules/typescript/bin/tsc --noEmit -p frontend/tsconfig.acceptance.json
      - name: Lint actual acceptance specs and config
        working-directory: frontend
        run: npx --no-install eslint e2e-acceptance playwright.acceptance.config.ts --report-unused-disable-directives --max-warnings 0
      - name: Build production frontend and same-main server (test-tagged; nonpublishable)
        run: |
          npm --prefix frontend run build
          go build -trimpath -tags=e2e,server,production -o "$GRIDO_E2E_BINARY" .
          go test -tags=e2e,server,production ./internal/service -run '^TestE2EDialogAdapter$' -count=1
          go test -tags=e2e,server,production . -run '^TestE2EHarness(Options|EndpointBoundary)$' -count=1
      - name: Install Chromium and OS dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Provision isolated disposable local Supabase on this runner
        id: provision
        run: node -- scripts/e2e/supabase-fixture.mjs start --root "$RUNNER_TEMP/grido-supabase" --env-file "$RUNNER_TEMP/grido-supabase.env"
      - name: Execute actual embedded frontend/server journeys
        id: server
        shell: bash
        run: |
          set +x
          source "$RUNNER_TEMP/grido-supabase.env"
          node scripts/e2e/report-run.mjs --root frontend --config playwright.acceptance.config.ts \
            --lane actual-linux --project real-server-chromium --shard 1/1 --fixture-kind actual-local-supabase \
            --required-case '[J01]' --required-case '[J02]' --required-case '[J03]' --required-case '[J04]' \
            --required-case '[J05]' --required-case '[J06]' --required-case '[J07]' \
            --fixture-input scripts/e2e/journey-fixtures.mjs --fixture-input scripts/e2e/runtime-process.mjs \
            --fixture-input scripts/e2e/supabase-fixture/config.toml \
            --output "$RUNNER_TEMP/evidence/server"
      - name: Build production admin against local sandbox only
        if: always() && steps.provision.outcome == 'success'
        id: admin_build
        shell: bash
        run: |
          set +x
          source "$RUNNER_TEMP/grido-supabase.env"
          npm --prefix admin-web run build
      - name: Execute actual independent admin auth and mutation journeys
        if: always() && steps.admin_build.outcome == 'success'
        id: admin
        shell: bash
        run: |
          set +x
          source "$RUNNER_TEMP/grido-supabase.env"
          node scripts/e2e/report-run.mjs --root admin-web --config playwright.acceptance.config.ts \
            --lane actual-admin --project admin-chromium --shard 1/1 --fixture-kind actual-local-supabase \
            --required-case '[A01]' --required-case '[A02]' \
            --fixture-input admin-web/e2e-acceptance/local-fixture.ts --fixture-input scripts/e2e/supabase-fixture/config.toml \
            --output "$RUNNER_TEMP/evidence/admin"
      - name: Execute actual phone storage/realtime sandbox journeys
        if: always() && steps.admin_build.outcome == 'success'
        id: phone
        shell: bash
        run: |
          set +x
          source "$RUNNER_TEMP/grido-supabase.env"
          node scripts/e2e/report-run.mjs --root admin-web --config playwright.acceptance.config.ts \
            --lane actual-phone --project phone-chromium --shard 1/1 --fixture-kind actual-local-supabase \
            --required-case '[P01]' \
            --fixture-input admin-web/e2e-acceptance/local-fixture.ts --fixture-input scripts/e2e/supabase-fixture/config.toml \
            --output "$RUNNER_TEMP/evidence/phone"
      - name: Stop disposable Supabase and remove private fixture credentials
        if: always()
        run: node -- scripts/e2e/supabase-fixture.mjs stop --root "$RUNNER_TEMP/grido-supabase" --env-file "$RUNNER_TEMP/grido-supabase.env"
      - name: Record sanitized actual infrastructure blocker
        if: always() && steps.provision.outcome != 'success'
        run: node scripts/e2e/report-infrastructure.mjs --stage local-supabase-provision --outcome "${{ steps.provision.outcome || 'skipped' }}" --output "$RUNNER_TEMP/evidence/infrastructure-failure.json"
      - name: Upload actual lane evidence only (never fixture root or env)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-actual-linux
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized disposable provision report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-sandbox-provision
          path: ${{ runner.temp }}/grido-supabase/provision-report.json
          if-no-files-found: error
          retention-days: 7

  acceptance-native:
    name: Windows real native WebView2 + SQLite (third-party contract auth)
    if: github.event_name == 'workflow_dispatch' && inputs.force_full && inputs.expected_sha != ''
    needs: [acceptance-preflight]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: "true"
      CGO_ENABLED: "1"
      GRIDO_ACCEPTANCE_LANE: native
    steps:
      - name: Set isolated native binary path (not a credential)
        shell: bash
        run: printf 'GRIDO_E2E_BINARY=%s/GridoStudio-acceptance-native.exe\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
          mkdir -p frontend/dist
          printf '<html></html>\n' > frontend/dist/index.html
      - name: Generate production bindings from exact sources
        run: wails3 generate bindings -ts -clean=true
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --prefer-offline --no-audit --no-fund
      - name: Typecheck actual acceptance specs and config
        run: node frontend/node_modules/typescript/bin/tsc --noEmit -p frontend/tsconfig.acceptance.json
      - name: Lint actual acceptance specs and config
        working-directory: frontend
        run: npx --no-install eslint e2e-acceptance playwright.acceptance.config.ts --report-unused-disable-directives --max-warnings 0
      - name: Build embedded production frontend and test-tagged native executable
        shell: bash
        run: |
          npm --prefix frontend run build
          go build -trimpath -tags=e2e,production -o "$GRIDO_E2E_BINARY" .
      - name: Install Chromium driver for native CDP
        working-directory: frontend
        run: npx --no-install playwright install chromium
      - name: Run actual native GUI journeys with loopback contract-auth fixture
        shell: bash
        run: |
          node scripts/e2e/report-run.mjs --root frontend --config playwright.acceptance.config.ts \
            --lane native-windows --project real-native-webview2 --shard 1/1 --fixture-kind native-third-party-contract \
            --required-case '[J01]' --required-case '[J02]' --required-case '[J03]' --required-case '[J04]' \
            --required-case '[J05]' --required-case '[J06]' --required-case '[J07]' \
            --fixture-input scripts/e2e/journey-fixtures.mjs --fixture-input scripts/e2e/runtime-process.mjs \
            --fixture-input scripts/e2e/runtime-auth-contract.mjs \
            --output "$RUNNER_TEMP/evidence"
      - name: Upload native evidence (video capability explicitly blocked; no release binary)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-native-windows
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7

  acceptance-gate:
    name: Final scoped acceptance summary (never whole-application done)
    if: always() && github.event_name == 'workflow_dispatch' && inputs.force_full && inputs.expected_sha != ''
    needs: [acceptance-preflight, full-gate, acceptance-linux, acceptance-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Free runner disk space for multi-lane evidence verification
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Download lane evidence without combining shard directories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acceptance-*
          path: downloaded-evidence
          merge-multiple: false
      - name: Gate every expected lane, project, shard, case and upstream result
        if: always()
        run: |
          node scripts/e2e/report-merge.mjs --input downloaded-evidence --output merged-evidence --sha "${{ github.sha }}" \
            --expected legacy-linux/chromium:4 \
            --expected actual-linux/real-server-chromium:1 --expected actual-admin/admin-chromium:1 \
            --expected actual-phone/phone-chromium:1 --expected native-windows/real-native-webview2:1 \
            --job preflight=${{ needs.acceptance-preflight.result }} --job full-ci=${{ needs.full-gate.result }} \
            --job linux-actual=${{ needs.acceptance-linux.result }} --job windows-native=${{ needs.acceptance-native.result }}
      - name: Reclaim raw download space after manifest and SHA-256 verification
        if: always()
        shell: bash
        run: rm -rf downloaded-evidence
      - name: Install report merger dependencies
        if: always()
        run: npm --prefix frontend ci --prefer-offline --no-audit --no-fund
      - name: Merge all Playwright blobs into HTML, JSON and JUnit
        if: always()
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../merged-evidence/html
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../merged-evidence/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../merged-evidence/results.xml
        run: npx --no-install playwright merge-reports --config=../scripts/e2e/report-merge.config.mjs --reporter=html,json,junit ../merged-evidence/blob
      - name: Upload final summary, blocked capability report and merged evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-final-summary
          path: merged-evidence/
          if-no-files-found: error
          retention-days: 7
