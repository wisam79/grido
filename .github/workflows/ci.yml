name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Downloads wailsjs bindings generated by
  #     the e2e-and-build job on Windows
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    needs: e2e-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Wails Bindings
        uses: actions/download-artifact@v4
        with:
          name: wailsjs-bindings
          path: frontend/wailsjs/

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit Tests & Coverage
        working-directory: ./frontend
        run: npm run test:coverage

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run Go Tests
        run: go test -v ./internal/...

  # ───────────────────────────────────────────────
  # Job 3: E2E Tests, Bindings & Smoke Build (Windows)
  #   → Generates wailsjs bindings & uploads them
  #     for the validate-frontend job
  # ───────────────────────────────────────────────
  e2e-and-build:
    name: E2E Tests & Windows Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Cache Downloaded Models & Fonts
        id: cache-models-fonts
        uses: actions/cache@v4
        with:
          path: |
            frontend/public/models
            frontend/public/fonts
            frontend/public/wasm
            frontend/public/onnxruntime-web
          key: ${{ runner.os }}-models-fonts-v2

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Download Offline Assets (Fonts & Models)
        if: steps.cache-models-fonts.outputs.cache-hit != 'true'
        working-directory: ./frontend
        shell: powershell
        run: |
          node scripts/download-fonts.js
          .\scripts\download-models.ps1

      - name: Install Wails CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate Wails Bindings
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist
          Set-Content frontend/dist/index.html "<html></html>"
          wails generate module

      - name: Upload Wails Bindings
        uses: actions/upload-artifact@v4
        with:
          name: wailsjs-bindings
          path: frontend/wailsjs/
          retention-days: 1

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium)
        working-directory: ./frontend
        run: npx playwright test --project=chromium

      - name: Build Wails App Binary (Smoke Test)
        run: wails build -platform windows/amd64 -ldflags "-X grido/internal/service.SupabaseURL=${{ secrets.SUPABASE_URL }} -X grido/internal/service.SupabaseAnonKey=${{ secrets.SUPABASE_ANON_KEY }} -X grido/internal/service.ModalAIKey=${{ secrets.GRIDO_AI_SECRET_KEY }}"
