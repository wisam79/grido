name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Frontend Quality & Unit Tests (Linux)
  #   → Fast, pure Node & Go bindings check
  # ───────────────────────────────────────────────
  validate-frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails3 CLI
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          fi

      - name: Generate Wails v3 Bindings
        id: generate_bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck Frontend
        id: typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Frontend (src + test + e2e)
        id: lint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit Tests & Coverage
        id: unit_tests
        working-directory: ./frontend
        run: npm run test:coverage

      # ملخّص صادق: يطبع نتيجة كل خطوة فعلياً (steps.<id>.outcome) وأرقام
      # التغطية الحقيقية — كان سابقاً جدولاً مكتوباً يدوياً يطبع ✅ مهما كانت النتيجة
      - name: Generate Frontend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "⚡ Frontend Quality & Unit Tests Summary" \
            --row "TypeScript Typecheck=${{ steps.typecheck.outcome }}" \
            --row "ESLint (src + test + e2e, 0 warnings)=${{ steps.lint.outcome }}" \
            --row "Vitest Unit & Component Tests=${{ steps.unit_tests.outcome }}" \
            --coverage coverage/coverage-summary.json

  # ───────────────────────────────────────────────
  # Job 2: Backend Quality & Unit Tests (Linux)
  #   → Fast Go verification with staticcheck binary caching
  # ───────────────────────────────────────────────
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      # مطلوب لخطوة الملخّص (node scripts/ci-step-summary.mjs) — كانت المشغّلات
      # تستعمل node المثبّت مسبقاً في الصورة ضمناً، فصار الاعتماد صريحاً
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Go Tools (staticcheck)
        id: cache-staticcheck
        uses: actions/cache@v4
        with:
          path: ~/go/bin/staticcheck
          key: ${{ runner.os }}-staticcheck-v2025

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Prepare placeholder frontend dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html

      - name: Go Vet
        id: go_vet
        run: go vet ./internal/...

      - name: Install staticcheck
        id: install_staticcheck
        if: steps.cache-staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        id: staticcheck
        run: staticcheck ./internal/... .

      - name: Run Go Tests
        id: go_tests
        run: go test -v ./internal/...

      - name: Generate Backend Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🛡️ Backend Quality & Go Tests Summary" \
            --row "Go Vet=${{ steps.go_vet.outcome }}" \
            --row "Staticcheck (0 warnings)=${{ steps.staticcheck.outcome }}" \
            --row "Go Unit & Integration Tests=${{ steps.go_tests.outcome }}"

  # ───────────────────────────────────────────────
  # Job 3: Playwright E2E Tests (Linux - 4 Shards Parallel Matrix)
  #   → 4 parallel shards executing 41 tests simultaneously
  # ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails3 CLI
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          fi

      - name: Generate Wails v3 Bindings
        id: generate_bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Browsers
        id: install_browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: e2e
        working-directory: ./frontend
        run: npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate E2E Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🎭 Playwright E2E (Chromium Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})" \
            --note "المحرك: Chromium Headless. محرك الإصدار الحقيقي (WebKit) يُفحص في مهمة WebKit Smoke بمخطط @smoke." \
            --row "Playwright Chromium Suite=${{ steps.e2e.outcome }}" \
            --row "Chromium Browsers Installation=${{ steps.install_browsers.outcome }}" \
            --row "Wails v3 Bridge Mock=${{ steps.generate_bindings.outcome }}"

  # ───────────────────────────────────────────────
  # Job 4: Windows Build Verification (Windows)
  #   → Real Wails v3 production binary build with Go Build Caching
  # ───────────────────────────────────────────────
  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Cache Go Build Cache (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~\go\bin
          key: ${{ runner.os }}-go-bin-v2

      - name: Add Go Bin to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails3 CLI
        shell: powershell
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          }

      - name: Build Wails v3 App Binary (Smoke Test)
        id: build
        shell: powershell
        env:
          CGO_ENABLED: '1'
          APP_VERSION: 'v0.0.0-ci'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: wails3 task build

      # قراءة الميتاداتا هنا تمر بنفس مسار Windows/.NET: الترجمة (lang+codepage) ثم
      # جدول نصوص مطابق لها. لذلك يفشل هذا الفحص إذا عاد `build/windows/info.json`
      # لمفتاح محايد (0000) أو فقد المفتاح النصي `FileVersion` — وهو ما يفعله
      # `wails3 update build-assets` عند إعادة توليد الأصول.
      - name: Verify EXE Branding Metadata
        id: branding
        shell: powershell
        run: |
          $exe = 'bin\GridoStudio.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $required = @('ProductName','CompanyName','FileDescription','FileVersion')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($v.$_) })
          if ($missing.Count -gt 0) {
            $hint = 'Windows resolves version strings only when build/windows/info.json uses an LCID table key (e.g. "0409", never the neutral "0000") AND declares the string key "FileVersion"; otherwise .NET/Explorer retry with fallback codepages that wipe every value.'
            throw ("EXE metadata empty: {0} - {1}" -f ($missing -join ', '), $hint)
          }
          Write-Host "Product='$($v.ProductName)' Company='$($v.CompanyName)' Version='$($v.FileVersion)' Description='$($v.FileDescription)' Language='$($v.Language)'"

      - name: Run Windows Native Integration Tests
        id: native_tests
        shell: powershell
        env:
          CGO_ENABLED: '1'
        run: go test -v ./internal/service -run "TestMediaService_CrossPlatformAndWindowsPaths|TestPrintService_HiRes300DPI_A4_FullScaleVerification|TestPrintNative_.*"

      - name: Generate Windows Build Summary
        if: always()
        shell: bash
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🪟 Windows Build Verification Summary" \
            --note "الهدف: Windows x64 (Wails v3 + CGO) مع اختبارات مسارات ويندوز ودقة 300 DPI." \
            --row "Compilation (wails3 task build)=${{ steps.build.outcome }}" \
            --row "EXE Branding Metadata=${{ steps.branding.outcome }}" \
            --row "Windows Native Integration Tests=${{ steps.native_tests.outcome }}"

  # ───────────────────────────────────────────────
  # Job 5: WebKit Smoke (محرك الإصدار الحقيقي)
  #   WebKitGTK (لينكس) و WebView2 (ويندوز) هي محركات الإصدار الفعلية،
  #   وWebKit أقرب محرك إليها في Playwright — بينما بقية الحزمة تعمل على
  #   chromium فقط. تُشغَّل مواصفات @smoke فقط (engine-smoke.spec.ts) وهي ضحلة
  #   ومستقرة ومستقلّة عن وضع الكانفاس: إقلاع وترسيم الكانفاس (سياق 2d)،
  #   وCtrl+K يفتح لوحة الأدوات وEsc يغلقها، واختيار أداة من الشريط يفتح لوحتها.
  #   إعلامية حالياً (continue-on-error) حتى تثبت على CI، ثم تُرفع إلى مُعطِّلة.
  # ───────────────────────────────────────────────
  webkit-smoke:
    name: WebKit Smoke (Shipping Engine)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (GTK4 & WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails)
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails3 CLI
        run: |
          if ! command -v wails3 >/dev/null 2>&1; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          fi

      - name: Generate Wails v3 Bindings
        id: generate_bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails3 generate bindings -ts -clean=true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright WebKit Browser
        id: install_browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps webkit

      - name: Run WebKit Smoke Tests (@smoke)
        id: webkit
        working-directory: ./frontend
        run: npx playwright test --project=webkit --grep @smoke

      - name: Upload WebKit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report/
          retention-days: 7

      - name: Generate WebKit Step Summary
        if: always()
        working-directory: ./frontend
        run: |
          node scripts/ci-step-summary.mjs \
            --title "🧭 WebKit Smoke (Shipping Engine) Summary" \
            --note "WebKit أقرب محرك إلى WebKitGTK/WebView2 الذي يُشحن به التطبيق. الفحص إعلامي (continue-on-error) حتى يثبت على CI." \
            --row "Playwright @smoke on WebKit=${{ steps.webkit.outcome }}" \
            --row "WebKit Browser Installation=${{ steps.install_browsers.outcome }}"
