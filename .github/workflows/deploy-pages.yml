name: Deploy Admin Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'admin-web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: admin-web

      - name: Build site
        run: npm run build
        working-directory: admin-web

      - name: Create 404 fallback for SPA client-side routing
        run: cp admin-web/dist/index.html admin-web/dist/404.html

      - name: Host static API endpoints and installer for clients
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p admin-web/dist/api
          # 1. Provide /api/version statically from GitHub Releases API
          gh api repos/${{ github.repository }}/releases/latest > admin-web/dist/api/version || true
          # 2. Provide /api/download statically for legacy v1.14.1 desktop clients
          gh release download --pattern "GridoStudio-installer.exe" --dir admin-web/dist/api --clobber || true
          if [ -f admin-web/dist/api/GridoStudio-installer.exe ]; then
            cp admin-web/dist/api/GridoStudio-installer.exe admin-web/dist/api/download
            cp admin-web/dist/api/GridoStudio-installer.exe admin-web/dist/GridoStudio-installer.exe
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'admin-web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
