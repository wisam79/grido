name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails & Staticcheck)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: |
            ~\go\bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Cache NSIS Compiler
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files (x86)\NSIS'
          key: ${{ runner.os }}-nsis-v1

      - name: Cache Downloaded Models & Fonts
        id: cache-models-fonts
        uses: actions/cache@v4
        with:
          path: |
            frontend/public/models
            frontend/public/fonts
            frontend/public/wasm
            frontend/public/onnxruntime-web
          key: ${{ runner.os }}-models-fonts-v2

      - name: Add Go Bin & NSIS to PATH
        shell: powershell
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Download Offline Assets (Fonts & Models)
        if: steps.cache-models-fonts.outputs.cache-hit != 'true'
        working-directory: ./frontend
        shell: powershell
        run: |
          node scripts/download-fonts.js
          .\scripts\download-models.ps1

      - name: Install NSIS Compiler
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install nsis -y

      - name: Install Python Dependencies & Generate Installer Assets
        run: |
          python -m pip install --upgrade pip pillow
          python build/windows/installer/generate_installer_assets.py

      - name: Install Wails CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Staticcheck
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Generate Wails Bindings
        run: |
          mkdir -p frontend/dist
          echo "<html></html>" > frontend/dist/index.html
          wails generate module

      - name: Run Go Vet & Staticcheck
        run: |
          go vet ./...
          staticcheck ./...

      - name: Build Wails App & NSIS Installer
        run: wails build -platform windows/amd64 -nsis -ldflags "-X grido/internal/service.AppVersion=${{ github.ref_name }} -X grido/internal/service.SupabaseURL=${{ secrets.SUPABASE_URL }} -X grido/internal/service.SupabaseAnonKey=${{ secrets.SUPABASE_ANON_KEY }} -X grido/internal/service.ModalAIKey=${{ secrets.GRIDO_AI_SECRET_KEY }}"

      - name: Prepare Executable Assets
        shell: powershell
        run: |
          Get-ChildItem -Path "build\bin"
          if (Test-Path "build\bin\Grido Studio.exe") {
            Copy-Item "build\bin\Grido Studio.exe" "build\bin\GridoStudio.exe" -Force
          }
          $installer = Get-ChildItem -Path "build\bin\*installer*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "build\bin\GridoStudio-installer.exe" -Force
            Copy-Item $installer.FullName "build\bin\Grido Studio Setup.exe" -Force
          } else {
            if (Test-Path "build\bin\GridoStudio.exe") {
              Copy-Item "build\bin\GridoStudio.exe" "build\bin\GridoStudio-installer.exe" -Force
              Copy-Item "build\bin\GridoStudio.exe" "build\bin\Grido Studio Setup.exe" -Force
            }
          }

      - name: Sign Executables via SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: SignPath/github-action-submit-signing-request@v1.1.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Grido_Studio'
          signing-policy-slug: 'release-policy'
          artifact-configuration-slug: 'initial-version'
          input-artifact-path: 'build/bin/GridoStudio.exe'
          output-artifact-path: 'build/bin/GridoStudio.exe'
          wait-for-completion: true

      - name: Generate SHA256 Checksums
        shell: powershell
        run: |
          # 🛡️ توليد بصمات SHA-256 لكل الملفات التنفيذية المنشورة — يستهلكها /api/version
          # ويتحقق منها التطبيق قبل تشغيل أي مثبت محمّل (حماية سلسلة الإمداد)
          $lines = @()
          Get-ChildItem -Path "build\bin\*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath "build\bin\grido-checksums.txt" -Encoding ascii
          Get-Content "build\bin\grido-checksums.txt"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/GridoStudio.exe
            build/bin/GridoStudio-installer.exe
            build/bin/Grido Studio Setup.exe
            build/bin/grido-checksums.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          name: Grido Studio Release ${{ github.ref_name }}
          body: |
            ## 🚀 Grido Studio Release
            - النسخة الفورية المبنية تلقائياً لنظام الويندوز.
            - يتضمن أحدث خوارزميات المعالجة والطباعة بالذكاء الاصطناعي.
            - يشمل نسخة Portable وملف تثبيت Installer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
