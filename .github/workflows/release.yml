name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Go Binaries (Wails & Staticcheck)
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: |
            ~\go\bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Cache NSIS Compiler
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files (x86)\NSIS
            C:\Program Files\NSIS
          key: ${{ runner.os }}-nsis-v2

      - name: Cache Downloaded Models & Fonts
        id: cache-models-fonts
        uses: actions/cache@v4
        with:
          path: |
            frontend/public/models
            frontend/public/fonts
            frontend/public/wasm
            frontend/public/onnxruntime-web
          key: ${{ runner.os }}-models-fonts-v3

      - name: Add Go Bin & NSIS to PATH
        shell: pwsh
        run: |
          $gopath = $(go env GOPATH)
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") | Where-Object { Test-Path "$_\makensis.exe" } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # يعمل دائماً (لا يُتخطّى عند إصابة الكاش): السكربتات idempotent (تتخطّى
      # الموجود)، وضمان تشغيله يمنع إصداراً بنماذج ناقصة من كاش قديم/جزئي.
      # `npm ci` أعلى هذه الخطوة يشغّل postinstall الذي ينسخ نموذج scanic.
      - name: Download Offline Assets (Fonts & Models)
        working-directory: ./frontend
        shell: powershell
        run: |
          node scripts/download-fonts.js
          .\scripts\download-models.ps1
          node scripts/copy-models.mjs

      - name: Install NSIS Compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
            Write-Host "Attempting winget install NSIS..."
            try {
              winget install NSIS.NSIS --accept-source-agreements --accept-package-agreements --silent
            } catch {
              Write-Warning "winget failed: $_"
            }
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
            Write-Host "Attempting choco install nsis..."
            choco install nsis -y --retry 3
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
            Write-Host "Attempting direct download of NSIS..."
            $nsisInstaller = "$env:TEMP\nsis-setup.exe"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe" -OutFile $nsisInstaller
            Start-Process -FilePath $nsisInstaller -ArgumentList "/S" -Wait
          }
          $nsisDir = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) {
            throw "makensis.exe was not found after all installation attempts!"
          }
          Write-Host "Found NSIS at: $nsisDir"
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python Dependencies & Generate Installer Assets
        run: |
          python -m pip install --upgrade pip pillow
          python build/windows/installer/generate_installer_assets.py

      - name: Install Wails3 CLI
        shell: pwsh
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          }

      - name: Generate Wails v3 Bindings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist
          Set-Content frontend/dist/index.html "<html></html>"
          wails3 generate bindings -ts -clean=true

      - name: Run Go Vet & Unit Tests
        run: |
          go vet ./internal/...
          go test ./internal/...

      - name: Validate Frontend Typecheck & Tests
        working-directory: ./frontend
        run: |
          npm run typecheck
          npm run test

      - name: Build Wails v3 App & NSIS Installer
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          APP_VERSION: ${{ github.ref_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 🔏 مفتاح Ed25519 العام (base64) للتحقق من توقيع المثبت — متغيّر
          # مستودع لا سرّ: المفتاح العام يُشحن داخل الثنائي عن قصد. غيابه
          # يُبقي المسار القديم (بصمة SHA-256 وحدها) مع تحذير في سجل التطبيق.
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
        run: |
          $nsisDir = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if ($nsisDir -and ($env:PATH -notlike "*$nsisDir*")) {
            $env:PATH = "$nsisDir;$env:PATH"
          }
          wails3 task package

      - name: Prepare Executable Assets
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          Get-ChildItem -Path 'bin'
          $exe = 'bin\GridoStudio.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected binary not found at $exe"
          }
          Copy-Item $exe 'bin\Grido Studio.exe' -Force

          $installerPath = 'build\windows\nsis\GridoStudio-installer.exe'
          if (Test-Path $installerPath) {
            Copy-Item $installerPath 'bin\GridoStudio-installer.exe' -Force
            Copy-Item $installerPath 'bin\Grido Studio Setup.exe' -Force
          } else {
            Write-Host "WARNING: NSIS installer not found at $installerPath - publishing portable exe copies instead."
            Copy-Item $exe 'bin\GridoStudio-installer.exe' -Force
            Copy-Item $exe 'bin\Grido Studio Setup.exe' -Force
          }

      - name: Upload Executables for Signing
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridoStudio-unsigned
          path: |
            bin/GridoStudio.exe
            bin/GridoStudio-installer.exe

      - name: Sign Executables via SignPath
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Grido_Studio'
          signing-policy-slug: 'Release_Policy'
          artifact-configuration-slug: 'initial-version'
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-artifact-directory: 'bin/signed'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800

      - name: Deploy Signed Executable
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          if (Test-Path "bin\signed") {
            Get-ChildItem -Path "bin\signed" | ForEach-Object { Write-Host "signed: $($_.Name)" }
            Get-ChildItem -Path "bin\signed\*.exe" | ForEach-Object {
              Copy-Item $_.FullName "bin\$($_.Name)" -Force
            }
          } else {
            Write-Host "Warning: bin\signed does not exist. Signing step might have failed or skipped."
          }
          if (Test-Path "bin\GridoStudio.exe") {
            Copy-Item "bin\GridoStudio.exe" "bin\Grido Studio.exe" -Force
          }


      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          # 🛡️ توليد بصمات SHA-256 لكل الملفات التنفيذية المنشورة — يستهلكها /api/version
          # ويتحقق منها التطبيق قبل تشغيل أي مثبت محمّل (حماية سلسلة الإمداد)
          $lines = @()
          Get-ChildItem -Path "bin\*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath "bin\grido-checksums.txt" -Encoding ascii
          Get-Content "bin\grido-checksums.txt"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/GridoStudio.exe
            bin/GridoStudio-installer.exe
            bin/Grido Studio Setup.exe
            bin/grido-checksums.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Grido Studio Release ${{ github.ref_name }}
          body: |
            ## 🚀 Grido Studio Release
            - النسخة الفورية المبنية تلقائياً لنظام الويندوز (Windows 64-bit).
            - يتضمن أحدث خوارزميات المعالجة والطباعة بالذكاء الاصطناعي مع دعم كامل للبصمات والتحديث التلقائي.
            - يشمل نسخة Portable وملف تثبيت Installer ومطابقة بصمات SHA-256.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger GitHub Pages Deployment
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Triggering deploy-pages.yml to update https://grido.cloud-ip.cc/api/version and download endpoint ..."
          gh workflow run deploy-pages.yml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

