# Dependabot — weekly security & maintenance updates (CI costs nothing:
# it only opens PRs; each PR still passes the full pipeline incl. docs-gate).
version: 2
updates:
  # GitHub Actions in .github/workflows (ci/release/deploy-pages) —
  # keeps setup-node/go/checkout/cache on patched majors.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # Frontend app dependencies (incl. Playwright browsers via lockfile).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  # Admin web + landing page dependencies.
  - package-ecosystem: "npm"
    directory: "/admin-web"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "admin-web"]

  # Go modules (incl. Wails v3 beta track).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
