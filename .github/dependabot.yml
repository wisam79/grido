# Dependabot — monthly low-noise security & patch updates (max 1 PR per ecosystem, no breaking majors)
version: 2
updates:
  # GitHub Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend app dependencies (patch & minor only)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "frontend"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Admin web dependencies (patch & minor only)
  - package-ecosystem: "npm"
    directory: "/admin-web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "admin-web"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Go modules (patch & minor only)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "backend"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
